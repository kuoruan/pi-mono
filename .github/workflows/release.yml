name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for npm Trusted Publishing (OIDC) + provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # changesets needs full history to compare versions
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # npm Trusted Publishing authenticates via OIDC; no token needed
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish
        id: changesets
        uses: changesets/action@v1
        with:
          # publish command: recursively publish every package with a new version
          # --provenance omitted: Trusted Publishing generates provenance automatically
          publish: pnpm publish -r --access public
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm Trusted Publishing via OIDC: no NPM_TOKEN / NODE_AUTH_TOKEN.
          # provenance attestations are auto-generated when publishing via trusted publisher.
          NPM_CONFIG_PROVENANCE: "true"

      - name: Published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Published: ${{ steps.changesets.outputs.published-packages }}"
