name: Release

# Automates versioning and publishing with Changesets.
# On every push to master:
#   - If there are pending changesets → opens/updates a "Version Packages" PR.
#   - If a Version PR was merged (no changesets left, packages to publish) →
#     publishes to npm via Trusted Publishing (OIDC).
#
# Note: select-mode routes to publish whenever `changeset publish-plan` finds
# packages not yet on npm. For an initial unpublished package (e.g.
# pi-permission-ai-guard@0.1.0), this means publish runs on every push to
# master until the first release lands. This is expected, not a bug.
#
# Uses changesets/action@v2 sub-actions (select-mode → version | publish) so
# `id-token: write` is scoped to the publish job only.
on:
  push:
    branches: [master]

# Reset permissions at workflow level; each job declares what it needs.
permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    name: Select mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # changesets needs full history to compare versions
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Create or update Version PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      version-dir-artifact-id: ${{ steps.version.outputs.version-dir-artifact-id }}
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to create pull request (changesets/action/version)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Version packages
        id: version
        uses: changesets/action/version@v2
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pack:
    name: Pack packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create releases (changesets/action/publish)
      id-token: write # for Trusted Publishing (OIDC)
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          # Provenance attestations are auto-generated when publishing via
          # trusted publisher.
          NPM_CONFIG_PROVENANCE: "true"
