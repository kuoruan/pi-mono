name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel superseded concurrent runs on the same branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm fmt:check
